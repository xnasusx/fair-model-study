<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAIR Model Study Tool — Build the Decomposition Tree from Memory</title>
  <meta name="description" content="An interactive study tool for the FAIR risk taxonomy: study the decomposition tree, rebuild it from memory, assign the right unit to every factor, and match all 22 definitions. A training exercise by Susan Shepard." />
  <meta name="author" content="Susan Shepard" />
  <meta name="robots" content="noindex, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="FAIR Model Study Tool" />
  <meta property="og:description" content="Build the FAIR decomposition tree from memory. Place components, assign units, match definitions." />
  <meta property="og:site_name" content="Susan Shepard" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Palette lifted from the u dont GRC me / xnasusx portfolio */
    :root{
      color-scheme:light;
      --paper:#f7ebed;
      --paper-2:#f0dee0;
      --panel:#ffffff;
      --ink:#3a3336;
      --ink-2:#4d4548;
      --muted:#7a7073;
      --line:#d8c9cc;
      --soft-line:rgba(58,51,54,0.08);
      --accent:#8d5860;
      --accent-2:#c7848d;
      --accent-soft:#f4dcdf;
      --chip:rgba(199,132,141,0.14);
      --amber:#9a6a24;
      --amber-soft:#f7e9d4;
      --sage:#4c7359;
      --sage-soft:#e2eee6;
      --plum:#6f5b86;
      --plum-soft:#ece7f2;
      --shadow:0 14px 36px rgba(58,51,54,0.13);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      background:var(--paper);
      color:var(--ink);
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      min-width:320px;
    }
    ::selection{background:var(--accent-soft);color:var(--ink)}
    a{color:inherit}
    a:hover{opacity:0.82}
    button{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    a:focus-visible,button:focus-visible{
      outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;
    }
    @keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
    @keyframes wrongShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(141,88,96,0.22)}50%{box-shadow:0 0 18px rgba(141,88,96,0.4)}}
    .pop-correct{animation:correctPop 0.35s ease-out}
    .shake-wrong{animation:wrongShake 0.35s ease-out}
    .glow-active{animation:glowPulse 1.5s ease-in-out infinite}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>
  'use strict';
  var h=React.createElement,useState=React.useState,useEffect=React.useEffect,useRef=React.useRef;

  var C={
    bg:"#f7ebed",bgCard:"#ffffff",bgBand:"#f0dee0",
    border:"rgba(58,51,54,0.08)",borderLight:"#d8c9cc",
    text:"#3a3336",textMuted:"#4d4548",textDim:"#7a7073",
    accent:"#8d5860",accent2:"#c7848d",accentSoft:"#f4dcdf",
    accentGlow:"rgba(199,132,141,0.28)",
    danger:"#b0474f",dangerSoft:"#f6e0e1",
    sage:"#4c7359",sageSoft:"#e2eee6",
    amber:"#9a6a24",amberSoft:"#f7e9d4",
    plum:"#6f5b86",plumSoft:"#ece7f2",
    shadow:"0 14px 36px rgba(58,51,54,0.13)"
  };
  C.success=C.sage;
  var ui="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  var display="'Fraunces', Georgia, serif";
  var LINE_COLOR="#d8c9cc";

  var eyebrow={fontFamily:ui,fontSize:11,fontWeight:600,letterSpacing:"0.14em",textTransform:"uppercase"};
  function cardStyle(mb,pad){
    return {background:C.bgCard,border:"1px solid "+C.borderLight,borderRadius:16,
      boxShadow:"0 10px 26px rgba(58,51,54,0.06)",padding:pad||(mb?"16px":"20px 24px")};
  }

  function useIsMobile(bp){var s=useState(false),m=s[0],set=s[1];useEffect(function(){function c(){set(window.innerWidth<(bp||768))}c();window.addEventListener("resize",c);return function(){window.removeEventListener("resize",c)};},[bp]);return m;}

  // ============================================================
  // FAIR MODEL DATA — V3.0, January 2025
  // ============================================================
  var NODES={
    risk:{id:"risk",abbr:"Risk",name:"Risk",def:"The probable frequency and probable magnitude of future loss",unit:"$",children:["lef","lm"]},
    lef:{id:"lef",abbr:"LEF",name:"Loss Event Frequency",def:"The probable frequency that a threat agent's actions will inflict harm upon an asset",unit:"#",children:["tef","susc"]},
    lm:{id:"lm",abbr:"LM",name:"Loss Magnitude",def:"The probable magnitude of loss resulting from a loss event",unit:"$",children:["pl","sl"]},
    tef:{id:"tef",abbr:"TEF",name:"Threat Event Frequency",def:"The probable frequency that a threat agent will act in a manner that may result in loss",unit:"#",children:["cf","poa"]},
    susc:{id:"susc",abbr:"Susc",name:"Susceptibility",def:"The probability that a threat event will become a loss event",unit:"%",children:["tcap","rs"]},
    pl:{id:"pl",abbr:"PL",name:"Primary Loss",def:"Loss that occurs directly as a result of the loss event",unit:"$",children:[]},
    sl:{id:"sl",abbr:"SL",name:"Secondary Loss",def:"Loss that occurs indirectly from a loss event due to secondary stakeholder reactions",unit:"$",children:["slef","slm"]},
    cf:{id:"cf",abbr:"CF",name:"Contact Frequency",def:"The frequency a threat agent will come into contact with an asset",unit:"#",children:[]},
    poa:{id:"poa",abbr:"PoA",name:"Probability of Action",def:"The probability a threat agent will act against an asset once contact has occurred",unit:"%",children:[]},
    tcap:{id:"tcap",abbr:"TCap",name:"Threat Capability",def:"A threat agent's ability to defeat resistive controls",unit:"%",children:[]},
    rs:{id:"rs",abbr:"RS",name:"Resistance Strength",def:"The efficacy of resistive controls against the overall threat population",unit:"%",children:[]},
    slef:{id:"slef",abbr:"SLEF",name:"Sec. Loss Event Freq.",def:"The percentage of loss events expected to have secondary effects",unit:"%",children:[]},
    slm:{id:"slm",abbr:"SLM",name:"Sec. Loss Magnitude",def:"How much loss is expected from secondary stakeholder reactions",unit:"$",children:[]},
  };
  var ALL_IDS=["risk","lef","lm","tef","susc","pl","sl","cf","poa","tcap","rs","slef","slm"];

  var FORMS_OF_LOSS=[
    {name:"Productivity Loss",def:"Reduction in organizational efficiency and effectiveness due to the loss event"},
    {name:"Response Costs",def:"Expenses incurred while addressing and mitigating the effects of a loss event"},
    {name:"Replacement Costs",def:"Expenditures related to restoring or replacing lost or damaged assets"},
    {name:"Fines and Judgments",def:"Financial penalties and legal settlements from regulatory violations or lawsuits"},
    {name:"Reputation Damage",def:"Long-term impact on the organization's brand and customer trust"},
    {name:"Competitive Advantage Loss",def:"When the loss event undermines the organization's market position or strategic initiatives"},
  ];

  var POA_SUBFACTORS=[
    {name:"Perceived Value",def:"The value the threat agent believes they will gain by acting against the asset"},
    {name:"Level of Effort",def:"The amount of work and resources the threat agent believes will be required to act"},
    {name:"Risk to Threat Agent",def:"The probability and severity of negative consequences the threat agent faces from acting"},
  ];

  // Unified quiz pool: 13 components + 6 forms of loss + 3 PoA sub-factors = 22 items
  var QUIZ_ITEMS=[];
  ALL_IDS.forEach(function(id){
    var n=NODES[id];
    QUIZ_ITEMS.push({qid:"node_"+id,name:n.abbr+" – "+n.name,def:n.def,cat:"component",unit:n.unit});
  });
  FORMS_OF_LOSS.forEach(function(f,i){
    QUIZ_ITEMS.push({qid:"fol_"+i,name:f.name,def:f.def,cat:"form_of_loss",unit:null});
  });
  POA_SUBFACTORS.forEach(function(f,i){
    QUIZ_ITEMS.push({qid:"poa_"+i,name:f.name,def:f.def,cat:"poa_sub",unit:null});
  });
  var ALL_QIDS=QUIZ_ITEMS.map(function(q){return q.qid;});
  var QMAP={};QUIZ_ITEMS.forEach(function(q){QMAP[q.qid]=q;});

  var CAT_COLORS={component:C.sage,form_of_loss:C.accent,poa_sub:C.plum};
  var CAT_SOFT={component:C.sageSoft,form_of_loss:C.accentSoft,poa_sub:C.plumSoft};
  var CAT_LABELS={component:"Model Component",form_of_loss:"Form of Loss",poa_sub:"PoA Sub-factor"};

  var UNIT_MAP={
    "$":{color:C.sage,soft:C.sageSoft,label:"Dollars"},
    "%":{color:C.plum,soft:C.plumSoft,label:"Probability"},
    "#":{color:C.amber,soft:C.amberSoft,label:"Frequency"}
  };

  function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=0|Math.random()*(i+1);var t=b[i];b[i]=b[j];b[j]=t;}return b;}

  // ============================================================
  // SECTION LABEL
  // ============================================================
  // Acts are labelled, not numbered — the badge that used to carry `n` is gone
  // and the label takes the act's colour instead.
  function SectionLabel(p){
    return h('div',{style:{display:"flex",alignItems:"center",marginBottom:20}},
      h('div',{style:Object.assign({},eyebrow,{fontSize:12,letterSpacing:"0.14em",color:p.color||C.accent})},p.label));
  }

  // ============================================================
  // UNIT BADGE
  // ============================================================
  function UnitBadge(p){
    var u=UNIT_MAP[p.unit],sz=p.size||24,fs=p.fs||12;
    return h('div',{style:{width:sz,height:sz,borderRadius:"50%",background:u.soft,border:"2px solid "+u.color,display:"inline-flex",alignItems:"center",justifyContent:"center",fontFamily:ui,fontSize:fs,fontWeight:700,color:u.color,flexShrink:0}},p.unit);
  }

  // ============================================================
  // RECURSIVE TREE WITH BRANCH LINES
  // ============================================================
  // This renders a node and recursively its children, with proper
  // T-shaped connector lines between parent and children.

  function TreeBranch(p){
    var nodeId=p.nodeId,renderNode=p.renderNode,mb=p.mb;
    var node=NODES[nodeId];
    var children=node.children;
    var vH=mb?20:28; // vertical connector height

    // Leaf node — just render the node
    if(children.length===0){
      return h('div',{style:{display:"flex",flexDirection:"column",alignItems:"center"}},
        renderNode(nodeId));
    }

    // Parent with children
    return h('div',{style:{display:"flex",flexDirection:"column",alignItems:"center"}},
      // The node itself
      renderNode(nodeId),
      // Vertical line down from parent
      h('div',{style:{width:2,height:vH,background:LINE_COLOR,flexShrink:0}}),
      // Children row with horizontal connector
      h('div',{style:{display:"flex",alignItems:"flex-start"}},
        children.map(function(cid,i){
          return h('div',{key:cid,style:{display:"flex",flexDirection:"column",alignItems:"center",position:"relative",margin:"0 "+(mb?2:4)+"px"}},
            // Horizontal connector segment
            // First child: right half. Last child: left half. Middle: full width.
            children.length>1&&h('div',{style:{
              position:"absolute",top:0,height:2,background:LINE_COLOR,
              left:i===0?"50%":"0",
              right:i===children.length-1?"50%":"0"
            }}),
            // Vertical line down to child
            h('div',{style:{width:2,height:vH,background:LINE_COLOR,flexShrink:0}}),
            // Recurse
            h(TreeBranch,{nodeId:cid,renderNode:renderNode,mb:mb}));
        })));
  }

  // ============================================================
  // SCALE-TO-FIT WRAPPER — shrinks tree to fit viewport
  // ============================================================
  function ScaledTreeWrap(p){
    var containerRef=useRef(null);
    var innerRef=useRef(null);
    var s=useState(1),scale=s[0],setScale=s[1];
    var s2=useState(null),h_=s2[0],setH=s2[1];

    useEffect(function(){
      function measure(){
        var c=containerRef.current,inner=innerRef.current;
        if(!c||!inner)return;
        var avail=c.clientWidth;
        var natural=inner.scrollWidth;
        if(natural>avail&&natural>0){
          var sc=Math.max(0.4,avail/natural);
          setScale(sc);
          setH(Math.ceil(inner.scrollHeight*sc));
        }else{
          setScale(1);
          setH(null);
        }
      }
      measure();
      window.addEventListener("resize",measure);
      var obs=typeof ResizeObserver!=="undefined"?new ResizeObserver(measure):null;
      if(obs&&innerRef.current)obs.observe(innerRef.current);
      return function(){window.removeEventListener("resize",measure);if(obs)obs.disconnect();};
    });

    return h('div',{ref:containerRef,style:{width:"100%",overflow:"hidden",height:h_!=null?h_:"auto"}},
      h('div',{ref:innerRef,style:{
        display:"flex",justifyContent:"center",width:"max-content",margin:"0 auto",
        transform:scale<1?"scale("+scale+")":"none",
        transformOrigin:"top left"
      }},p.children));
  }

  // ============================================================
  // STUDY MODE
  // ============================================================
  function StudyNodeBox(p){
    var mb=p.mb,node=NODES[p.id];
    return h('div',{style:{
      background:C.bgCard,border:"2px solid "+C.sage,borderRadius:12,
      boxShadow:"0 6px 16px rgba(58,51,54,0.06)",
      padding:mb?"8px 6px":"10px 12px",
      width:mb?105:150,textAlign:"center"
    }},
      h('div',{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:5,marginBottom:3}},
        h('span',{style:{fontFamily:display,fontSize:mb?15:18,fontWeight:700,color:C.text}},node.abbr),
        h(UnitBadge,{unit:node.unit,size:mb?20:24,fs:mb?10:12})),
      h('div',{style:{fontFamily:ui,fontSize:mb?9:10,fontWeight:500,color:C.textDim,lineHeight:1.35}},node.name));
  }

  function StudyTree(p){
    var mb=p.mb;
    function renderNode(id){return h(StudyNodeBox,{id:id,mb:mb});}
    return h(ScaledTreeWrap,null,
      h(TreeBranch,{nodeId:"risk",renderNode:renderNode,mb:mb}));
  }

  // ============================================================
  // PRACTICE MODE — INTERLEAVED COMPONENT + UNIT PLACEMENT
  // ============================================================
  function PracticeMode(p){
    var mb=p.mb,onReset=p.onReset;

    // What's placed where
    var s1=useState({}),placed=s1[0],setPlaced=s1[1];           // {slotId: true}
    var s2=useState({}),units=s2[0],setUnits=s2[1];             // {slotId: "$"|"%"|"#"}
    var s3=useState(function(){return shuffle(ALL_IDS);}),pool=s3[0],setPool=s3[1];
    var s4=useState(null),selected=s4[0],setSelected=s4[1];     // nodeId picked from pool
    var s5=useState(null),unitTarget=s5[0],setUnitTarget=s5[1]; // slotId awaiting unit
    var s6=useState({}),slotFb=s6[0],setSlotFb=s6[1];           // {slotId: "correct"|"wrong"}
    var s7=useState(0),compScore=s7[0],setCompScore=s7[1];
    var s8=useState(0),compTries=s8[0],setCompTries=s8[1];
    var s9=useState(0),unitScore=s9[0],setUnitScore=s9[1];
    var s10=useState(0),unitTries=s10[0],setUnitTries=s10[1];

    var allDone=Object.keys(units).length>=ALL_IDS.length;
    var placedCount=Object.keys(placed).length;
    var unitCount=Object.keys(units).length;

    function flash(slotId,type){
      setSlotFb(function(f){var n={};for(var k in f)n[k]=f[k];n[slotId]=type;return n;});
      setTimeout(function(){
        setSlotFb(function(f){var n={};for(var k in f)n[k]=f[k];delete n[slotId];return n;});
      },450);
    }

    // Tap a component in the pool
    function pickFromPool(id){
      if(unitTarget) return; // busy assigning a unit
      setSelected(function(prev){return prev===id?null:id;});
    }

    // Tap an empty slot to place the selected component
    function tapSlot(slotId){
      if(unitTarget) return;
      if(placed[slotId]) return;
      if(!selected) return;

      setCompTries(function(t){return t+1;});

      if(selected===slotId){
        // Correct!
        setCompScore(function(s){return s+1;});
        setPlaced(function(p){var n={};for(var k in p)n[k]=p[k];n[slotId]=true;return n;});
        setPool(function(pp){return pp.filter(function(id){return id!==selected;});});
        flash(slotId,"correct");
        setSelected(null);
        // Immediately prompt for unit
        setUnitTarget(slotId);
      } else {
        flash(slotId,"wrong");
      }
    }

    // Tap a unit button while unitTarget is active
    function tapUnit(symbol){
      if(!unitTarget) return;
      var correctUnit=NODES[unitTarget].unit;
      setUnitTries(function(t){return t+1;});

      if(symbol===correctUnit){
        setUnitScore(function(s){return s+1;});
        setUnits(function(u){var n={};for(var k in u)n[k]=u[k];n[unitTarget]=symbol;return n;});
        flash(unitTarget,"correct");
        setUnitTarget(null);
      } else {
        flash(unitTarget,"wrong");
      }
    }

    // Render a single node in the tree
    function renderNode(slotId){
      var node=NODES[slotId];
      var isFilled=placed[slotId];
      var hasUnit=units[slotId];
      var isUnitTarget=unitTarget===slotId;
      var fb=slotFb[slotId];
      var isEmpty=!isFilled;
      var isClickable=isEmpty&&selected&&!unitTarget;

      // Border color
      var bColor=C.borderLight;
      if(fb==="correct") bColor=C.sage;
      else if(fb==="wrong") bColor=C.danger;
      else if(isUnitTarget) bColor=C.accent;
      else if(isFilled&&hasUnit) bColor=C.sage;
      else if(isFilled) bColor=C.accent;

      // Class for animation
      var cls="";
      if(fb==="correct") cls="pop-correct";
      else if(fb==="wrong") cls="shake-wrong";
      else if(isUnitTarget&&!fb) cls="glow-active";

      var w=mb?105:150;

      return h('div',{
        key:slotId,
        className:cls,
        onClick:function(){if(isEmpty)tapSlot(slotId);},
        style:{
          background:isFilled?C.bgCard:"transparent",
          border:"2px "+(isEmpty?"dashed":"solid")+" "+bColor,
          borderRadius:12,
          boxShadow:isFilled?"0 6px 16px rgba(58,51,54,0.06)":"none",
          padding:mb?"10px 4px":"10px 8px",
          width:w,
          minHeight:mb?58:62,
          textAlign:"center",
          cursor:isClickable?"pointer":"default",
          transition:"border-color 0.2s, box-shadow 0.2s",
          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"
        }
      },
        // EMPTY SLOT
        isEmpty&&h('div',{style:{fontFamily:ui,fontSize:mb?11:13,color:C.textDim,letterSpacing:"0.12em"}},"• • •"),

        // FILLED — waiting for unit assignment. The buttons live in the card
        // below the tree, not in here: the tree is scaled to fit, so in-node
        // buttons shrink to ~17px on a narrow screen and become untappable.
        isFilled&&isUnitTarget&&h('div',null,
          h('div',{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:4}},
            h('span',{style:{fontFamily:display,fontSize:mb?15:18,fontWeight:700,color:C.text}},node.abbr),
            h('div',{style:{width:mb?20:24,height:mb?20:24,borderRadius:"50%",background:C.accentSoft,border:"2px dashed "+C.accent,display:"inline-flex",alignItems:"center",justifyContent:"center",fontFamily:ui,fontSize:mb?10:12,fontWeight:700,color:C.accent,flexShrink:0}},"?")),
          h('div',{style:{fontFamily:ui,fontSize:mb?9:10,fontWeight:500,color:C.textDim,marginTop:2}},node.name)),

        // FILLED — unit assigned (complete)
        isFilled&&!isUnitTarget&&hasUnit&&h('div',null,
          h('div',{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:4}},
            h('span',{style:{fontFamily:display,fontSize:mb?15:18,fontWeight:700,color:C.text}},node.abbr),
            h(UnitBadge,{unit:hasUnit,size:mb?20:24,fs:mb?10:12})),
          h('div',{style:{fontFamily:ui,fontSize:mb?9:10,fontWeight:500,color:C.textDim,marginTop:2}},node.name)),

        // FILLED — no unit yet, but not the current target (shouldn't happen in normal flow, but just in case)
        isFilled&&!isUnitTarget&&!hasUnit&&h('div',null,
          h('div',{style:{fontFamily:display,fontSize:mb?15:18,fontWeight:700,color:C.text}},node.abbr),
          h('div',{style:{fontFamily:ui,fontSize:mb?9:10,fontWeight:500,color:C.textDim,marginTop:2}},node.name)));
    }

    // Instruction text
    var instrText="";
    var instrColor=C.accent;
    if(allDone){
      instrText="✓ Complete — you built the full FAIR model from memory.";
      instrColor=C.sage;
    } else if(unitTarget){
      instrText="Now assign the correct unit ($, %, #) to "+NODES[unitTarget].abbr;
      instrColor=C.accent;
    } else if(selected){
      instrText="Tap the correct position for "+NODES[selected].abbr+" ("+NODES[selected].name+")";
      instrColor=C.text;
    } else {
      instrText="Select a component from the pool below";
      instrColor=C.textDim;
    }

    return h('div',null,
      // Score
      h('div',{style:{display:"flex",gap:20,justifyContent:"center",marginBottom:10,flexWrap:"wrap"}},
        h('div',{style:{fontFamily:ui,fontSize:12,fontWeight:500,color:C.textDim}},
          "Components: ",h('span',{style:{color:C.sage,fontWeight:700}},placedCount),"/13",
          compTries>0?(" \xB7 "+Math.round(compScore/compTries*100)+"%"):""),
        h('div',{style:{fontFamily:ui,fontSize:12,fontWeight:500,color:C.textDim}},
          "Units: ",h('span',{style:{color:C.sage,fontWeight:700}},unitCount),"/13",
          unitTries>0?(" \xB7 "+Math.round(unitScore/unitTries*100)+"%"):"")),

      // Instruction
      h('div',{style:{textAlign:"center",marginBottom:18,fontFamily:ui,fontSize:mb?13:14,color:instrColor,fontWeight:600,minHeight:22}},instrText),

      // Tree
      h(ScaledTreeWrap,null,
        h(TreeBranch,{nodeId:"risk",renderNode:renderNode,mb:mb})),

      // Unit prompt — takes the pool's place while a unit is pending, so the
      // next action is always full size and in the spot you are already looking at.
      unitTarget&&h('div',{style:Object.assign({},cardStyle(mb,mb?"14px":"16px 20px"),{marginTop:24,borderLeft:"3px solid "+C.accent})},
        h('div',{style:Object.assign({},eyebrow,{fontSize:10,color:C.accent,marginBottom:10})},"Assign the unit"),
        h('div',{style:{textAlign:"center",fontFamily:ui,fontSize:mb?12:13,color:C.textDim,marginBottom:14}},
          "What unit does ",
          h('span',{style:{fontWeight:700,color:C.text}},NODES[unitTarget].abbr),
          " — ",NODES[unitTarget].name," — carry?"),
        h('div',{style:{display:"flex",gap:mb?14:18,justifyContent:"center",flexWrap:"wrap"}},
          ["$","%","#"].map(function(u){
            var uc=UNIT_MAP[u];
            return h('div',{key:u,style:{display:"flex",flexDirection:"column",alignItems:"center",gap:6}},
              h('button',{
                onClick:function(){tapUnit(u);},
                style:{
                  width:mb?54:58,height:mb?54:58,borderRadius:"50%",
                  background:uc.soft,border:"2px solid "+uc.color,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontFamily:ui,fontSize:mb?21:23,fontWeight:700,color:uc.color,
                  cursor:"pointer",transition:"transform 0.1s"
                },
                onMouseEnter:function(e){e.currentTarget.style.transform="scale(1.08)";},
                onMouseLeave:function(e){e.currentTarget.style.transform="none";}
              },u),
              h('div',{style:{fontFamily:ui,fontSize:mb?10:11,fontWeight:500,color:C.textDim}},uc.label));
          }))),

      // Component pool
      !allDone&&!unitTarget&&h('div',{style:Object.assign({},cardStyle(mb,mb?"14px":"16px 20px"),{marginTop:24})},
        h('div',{style:Object.assign({},eyebrow,{fontSize:10,color:C.accent,marginBottom:10})},"Component Pool"),
        pool.length>0
          ? h('div',{style:{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}},
              pool.map(function(id){
                var node=NODES[id];
                var isSel=selected===id;
                return h('button',{
                  key:id,
                  onClick:function(){pickFromPool(id);},
                  style:{
                    background:isSel?C.accentSoft:C.bg,
                    border:"1px solid "+(isSel?C.accent:C.borderLight),
                    borderRadius:999,
                    padding:mb?"7px 12px":"8px 14px",
                    cursor:"pointer",
                    fontFamily:ui,fontSize:mb?11:12,
                    color:isSel?C.accent:C.text,
                    fontWeight:isSel?700:600,
                    transition:"all 0.15s",
                    boxShadow:isSel?"0 0 12px "+C.accentGlow:"none"
                  }
                },
                  h('span',{style:{fontWeight:700}},node.abbr),
                  h('span',{style:{fontSize:mb?10:11,fontWeight:500,color:C.textDim,marginLeft:6}},node.name));
              }))
          : h('div',{style:{fontFamily:ui,fontSize:12,color:C.textDim,textAlign:"center",padding:8}},"All components placed. Finish assigning units.")),

      // Done state
      allDone&&h('div',{style:Object.assign({},cardStyle(mb,"20px"),{marginTop:24,textAlign:"center",borderLeft:"3px solid "+C.sage})},
        h('div',{style:{fontSize:28,marginBottom:8}},"🎉"),
        h('div',{style:{fontFamily:display,fontSize:mb?18:22,fontWeight:700,color:C.text,marginBottom:6}},"FAIR model complete"),
        h('div',{style:{fontFamily:ui,fontSize:13,color:C.textDim,marginBottom:16}},
          "Components: "+Math.round(compScore/compTries*100)+"% \xB7 Units: "+Math.round(unitScore/unitTries*100)+"%"),
        h('button',{onClick:onReset,style:{background:C.accent,color:C.bg,border:"1px solid "+C.accent,borderRadius:999,padding:"10px 24px",fontFamily:ui,fontSize:12,fontWeight:600,letterSpacing:"0.02em",cursor:"pointer",transition:"background 0.12s ease, border-color 0.12s ease"},
          onMouseEnter:function(e){e.currentTarget.style.background=C.text;e.currentTarget.style.borderColor=C.text;},
          onMouseLeave:function(e){e.currentTarget.style.background=C.accent;e.currentTarget.style.borderColor=C.accent;}},"Practice Again")));
  }

  // ============================================================
  // DEFINITIONS QUIZ — 22 items, always visible
  // ============================================================
  function DefinitionsQuiz(p){
    var mb=p.mb;
    var TOTAL=QUIZ_ITEMS.length;
    var s2=useState(function(){return shuffle(ALL_QIDS.slice());}),defCards=s2[0],setDefCards=s2[1];
    var s3=useState(function(){return shuffle(ALL_QIDS.slice());}),namePool=s3[0],setNamePool=s3[1];
    var s4=useState({}),matched=s4[0],setMatched=s4[1];
    var s5=useState(null),selId=s5[0],setSelId=s5[1];
    var s6=useState({}),fb=s6[0],setFb=s6[1];
    var s7=useState(0),correct=s7[0],setCorrect=s7[1];
    var s8=useState(0),tries=s8[0],setTries=s8[1];

    function startQuiz(){
      setDefCards(shuffle(ALL_QIDS.slice()));
      setNamePool(shuffle(ALL_QIDS.slice()));
      setMatched({});setSelId(null);setFb({});
      setCorrect(0);setTries(0);
    }

    function tapCard(qid){
      if(!selId) return;
      if(matched[qid]) return;
      setTries(function(t){return t+1;});
      if(selId===qid){
        setCorrect(function(c){return c+1;});
        setMatched(function(m){var n={};for(var k in m)n[k]=m[k];n[qid]=true;return n;});
        setNamePool(function(pp){return pp.filter(function(id){return id!==selId;});});
        setFb(function(f){var n={};for(var k in f)n[k]=f[k];n[qid]="correct";return n;});
        setSelId(null);
      } else {
        setFb(function(f){var n={};for(var k in f)n[k]=f[k];n[qid]="wrong";return n;});
        setTimeout(function(){setFb(function(f){var n={};for(var k in f)n[k]=f[k];delete n[qid];return n;});},400);
      }
    }

    var matchCount=Object.keys(matched).length;
    var allDone=matchCount>=TOTAL;

    // Quiz is always active — no start screen
    return h('div',null,
      // Score
      h('div',{style:{fontFamily:ui,fontSize:12,fontWeight:500,color:C.textDim,marginBottom:10,textAlign:"center"}},
        "Matched: ",h('span',{style:{color:C.sage,fontWeight:700}},matchCount),"/",TOTAL,
        tries>0?(" \xB7 "+Math.round(correct/tries*100)+"% accuracy"):""),

      // Category legend
      h('div',{style:{display:"flex",gap:16,justifyContent:"center",flexWrap:"wrap",marginBottom:14}},
        [["component","Components"],["form_of_loss","Forms of Loss"],["poa_sub","PoA Sub-factors"]].map(function(pair){
          return h('div',{key:pair[0],style:{display:"flex",alignItems:"center",gap:6}},
            h('div',{style:{width:9,height:9,borderRadius:3,background:CAT_COLORS[pair[0]]}}),
            h('span',{style:{fontFamily:ui,fontSize:11,fontWeight:500,color:C.textDim}},pair[1]));
        })),

      // Instruction
      h('div',{style:{fontFamily:ui,fontSize:mb?13:14,color:selId?C.text:C.textDim,textAlign:"center",marginBottom:16,fontWeight:selId?600:500,minHeight:20}},
        selId
          ? "Tap the definition for: "+QMAP[selId].name
          : "Select a name below, then tap its matching definition"),

      // Definition cards
      h('div',{style:{display:"grid",gridTemplateColumns:mb?"1fr":"1fr 1fr",gap:10}},
        defCards.map(function(qid){
          var item=QMAP[qid];
          var isMatched=matched[qid];
          var fbState=fb[qid];
          var catColor=CAT_COLORS[item.cat];
          var bColor=fbState==="correct"?C.sage:fbState==="wrong"?C.danger:isMatched?catColor:C.borderLight;
          var cls=fbState==="correct"?"pop-correct":fbState==="wrong"?"shake-wrong":"";
          return h('div',{
            key:qid,
            className:cls,
            onClick:function(){tapCard(qid);},
            style:{
              background:isMatched?C.bgCard:"transparent",
              border:"1px "+(isMatched?"solid":"dashed")+" "+bColor,
              borderLeft:isMatched?("3px solid "+catColor):undefined,
              borderRadius:12,padding:"12px 16px",
              boxShadow:isMatched?"0 8px 20px rgba(58,51,54,0.05)":"none",
              cursor:isMatched?"default":"pointer",
              transition:"border-color 0.2s, box-shadow 0.2s"
            }
          },
            isMatched&&h('div',{style:{display:"flex",alignItems:"center",gap:6,marginBottom:5,flexWrap:"wrap"}},
              h('span',{style:{fontFamily:ui,fontSize:12,fontWeight:700,letterSpacing:"0.01em",color:catColor}},item.name),
              item.unit&&h(UnitBadge,{unit:item.unit,size:18,fs:9})),
            h('div',{style:{fontFamily:display,fontSize:mb?13:14,fontStyle:"italic",color:C.textMuted,lineHeight:1.55}},"“"+item.def+"”"));
        })),

      // Name pool
      namePool.length>0&&h('div',{style:Object.assign({},cardStyle(mb,mb?"14px":"16px 20px"),{marginTop:16})},
        h('div',{style:Object.assign({},eyebrow,{fontSize:10,color:C.accent,marginBottom:10})},"Tap a name to select it"),
        h('div',{style:{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}},
          namePool.map(function(qid){
            var item=QMAP[qid];
            var isSel=selId===qid;
            var catColor=CAT_COLORS[item.cat];
            return h('button',{
              key:qid,
              onClick:function(){setSelId(function(prev){return prev===qid?null:qid;});},
              style:{
                background:isSel?CAT_SOFT[item.cat]:C.bg,
                border:"1px solid "+(isSel?catColor:C.borderLight),
                borderRadius:999,padding:"6px 12px",cursor:"pointer",
                fontFamily:ui,fontSize:mb?11:11,fontWeight:isSel?700:600,
                color:isSel?catColor:C.text,
                transition:"all 0.15s",
                boxShadow:isSel?"0 0 12px "+C.accentGlow:"none"
              }
            },item.name);
          }))),

      // Done
      allDone&&h('div',{style:{textAlign:"center",marginTop:20}},
        h('div',{style:{fontSize:24,marginBottom:6}},"🎉"),
        h('div',{style:{fontFamily:display,fontSize:mb?17:20,fontWeight:700,color:C.sage,marginBottom:12}},
          "All 22 definitions matched \xB7 "+Math.round(correct/tries*100)+"% accuracy"),
        h('button',{onClick:startQuiz,style:{background:"transparent",border:"1px solid "+C.accent,color:C.accent,borderRadius:999,padding:"9px 20px",fontFamily:ui,fontSize:12,fontWeight:600,letterSpacing:"0.02em",cursor:"pointer",transition:"background 0.12s ease, color 0.12s ease"},
          onMouseEnter:function(e){e.currentTarget.style.background=C.accent;e.currentTarget.style.color=C.bg;},
          onMouseLeave:function(e){e.currentTarget.style.background="transparent";e.currentTarget.style.color=C.accent;}},"Quiz Again")));
  }

  // ============================================================
  // MAIN APP
  // ============================================================
  // The portfolio risk lab renders this page in an iframe and carries the lesson
  // copy in its own header, so Act 1 is skipped when we are embedded.
  var EMBEDDED=(function(){try{return window.self!==window.top;}catch(e){return true;}})();

  function App(){
    var mb=useIsMobile();
    var s1=useState("study"),mode=s1[0],setMode=s1[1];
    var s2=useState(0),practiceKey=s2[0],setPracticeKey=s2[1];

    function startPractice(){setMode("practice");setPracticeKey(function(k){return k+1;});}

    var pd=mb?16:24;
    var prose={maxWidth:"none",fontFamily:ui,fontSize:mb?15:16,lineHeight:1.75,color:C.textMuted};

    function modeBtn(label,isOn,onClick){
      return h('button',{onClick:onClick,style:{
        background:isOn?C.accent:"transparent",color:isOn?C.bg:C.accent,
        border:"1px solid "+C.accent,borderRadius:999,padding:mb?"9px 18px":"10px 22px",
        fontFamily:ui,fontSize:12,fontWeight:600,letterSpacing:"0.02em",cursor:"pointer",
        transition:"background 0.12s ease, color 0.12s ease"
      }},label);
    }

    // 100vh inside the iframe is the frame's own height, which pins the page to
    // whatever height the parent last set and leaves dead space under the content.
    return h('div',{style:{minHeight:EMBEDDED?0:"100vh",background:C.bg,color:C.text}},

      // ACT 1
      !EMBEDDED&&h('div',{style:{maxWidth:1400,margin:"0 auto",padding:(mb?40:64)+"px "+pd+"px 0"}},
        h(SectionLabel,{label:"The Lesson",color:C.amber}),
        h('h1',{style:{fontFamily:display,fontSize:mb?34:52,fontWeight:700,lineHeight:1.05,letterSpacing:"-0.02em",marginBottom:24,maxWidth:760,color:C.text}},
          "The FAIR Model, ",h('em',{style:{fontStyle:"italic",color:C.accent}},"from Memory")),
        h('div',{style:prose},
          h('p',{style:{marginBottom:16}},"The FAIR model decomposes risk into its fundamental components. For certification you need this taxonomy cold: every factor, where it sits in the tree, and what unit it carries. Dollars ($) for financial amounts, percent (%) for probabilities, and count (#) for frequencies."),
          h('p',null,"Study the tree below, then switch to practice mode and rebuild it from memory — place each component, then assign its unit. The definitions quiz underneath is a separate exercise covering all 22 testable items: the 13 model components, the 6 forms of loss, and the 3 Probability of Action sub-factors."))),

      // ACT 2
      h('div',{style:{maxWidth:1400,margin:"0 auto",padding:(mb?32:48)+"px "+pd+"px 0"}},
        h(SectionLabel,{label:"The Tool"}),

        h('div',{style:cardStyle(mb,mb?"16px 12px":"24px")},
          // Mode toggle
          h('div',{style:{display:"flex",gap:10,marginBottom:18,justifyContent:"center"}},
            modeBtn("📖 Study",mode==="study",function(){setMode("study");}),
            modeBtn("🎯 Practice",mode==="practice",startPractice)),

          // Unit legend
          h('div',{style:{display:"flex",gap:18,justifyContent:"center",marginBottom:22,flexWrap:"wrap"}},
            [["$","Dollars"],["%","Probability / Percentile"],["#","Frequency (count)"]].map(function(pair){
              return h('div',{key:pair[0],style:{display:"flex",alignItems:"center",gap:7}},
                h(UnitBadge,{unit:pair[0],size:22,fs:11}),
                h('span',{style:{fontFamily:ui,fontSize:11,fontWeight:500,color:C.textDim}},pair[1]));
            })),

          // CONTENT
          mode==="study"
            ? h(StudyTree,{mb:mb})
            : h(PracticeMode,{key:practiceKey,mb:mb,onReset:startPractice}))),

      // ACT 3 — DEFINITIONS QUIZ
      h('div',{style:{maxWidth:1400,margin:"0 auto",padding:(mb?32:48)+"px "+pd+"px 0"}},
        h(SectionLabel,{label:"Definitions Quiz",color:C.plum}),
        h(DefinitionsQuiz,{mb:mb})),

      // ACT 4
      h('div',{style:{maxWidth:1400,margin:"0 auto",padding:(mb?32:48)+"px "+pd+"px 0"}},
        h(SectionLabel,{label:"The Takeaway",color:C.sage}),
        h('div',{style:prose},
          h('p',{style:{marginBottom:16}},"Every factor in the FAIR tree is a lever you can measure, estimate, and act on. Knowing where each one sits, what it measures, and how it connects to its neighbours is what turns the model from a diagram into something you can actually run an assessment with."),
          h('p',null,"Practice until you can build the whole tree from memory without a mistake. That is the point at which the taxonomy stops being something you look up and starts being something you think in.")),

        h('div',{style:{height:mb?72:140}})));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
